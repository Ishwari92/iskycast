name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Builds the site and publishes dist/ to the gh-pages branch, which GitHub Pages serves.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install (not ci) tolerates npm-version differences in optional peer deps.
      - run: npm install --no-audit --no-fund

      # Serves the app from /iskycast/ (see vite.config.ts).
      - run: npm run build -- --mode ghpages

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
